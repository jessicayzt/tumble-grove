<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tumble Grove</title>
  <link rel="icon" href="icons/icon.png">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <canvas id="bg" class="layer" aria-hidden="true"></canvas>
  <canvas id="fg" class="layer" aria-label="Forest floor with rolling sloths. Click above the ground to drop a leaf."></canvas>

  <div class="hud">
    <button id="reset" class="hud__button" type="button"
            title="Reset all sloths"
            aria-label="Reset all sloths">
      <!-- icon: Lucide "rotate-ccw" (ISC) -->
      <svg class="hud__button-icon" viewBox="0 0 24 24" width="26" height="26" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>

    <aside id="meter" class="meter" aria-label="Sloth-o-meter">
      <img class="meter__icon" src="icons/icon.png" alt="" width="30" height="30">
      <label class="meter__label" for="sloth-count">Sloth-o-meter</label>
      <input id="sloth-count" class="meter__slider" type="range" min="1" max="20" step="1" value="3">
      <output class="meter__value" for="sloth-count" id="sloth-count-value">3</output>
    </aside>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
